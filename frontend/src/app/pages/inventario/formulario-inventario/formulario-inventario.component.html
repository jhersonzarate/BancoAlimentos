<!-- src/app/pages/inventario/formulario-inventario/formulario-inventario.component.html -->
<app-topbar [titulo]="esEdicion ? 'Editar ítem' : 'Nuevo ítem de inventario'"></app-topbar>

<div class="page-body">
  <div class="page-header">
    <div>
      <h1>{{ esEdicion ? 'Editar ítem de inventario' : 'Registrar ítem de inventario' }}</h1>
      <p>Stock disponible por tipo de alimento</p>
    </div>
    <button class="btn btn--secundario" routerLink="/inventario">
      <span class="material-icons">arrow_back</span>
      Volver
    </button>
  </div>

  <div class="card formulario-card">
    <form [formGroup]="form" (ngSubmit)="guardar()">

      <div class="form-fila">
        <div class="form-grupo">
          <label>Tipo de alimento *</label>
          <input type="text" formControlName="tipoAlimento"
                 placeholder="Ej: Arroz, Fideos, Aceite">
          <span class="error-msg"
                *ngIf="form.get('tipoAlimento')?.invalid && form.get('tipoAlimento')?.touched">
            El tipo de alimento es obligatorio
          </span>
        </div>

        <div class="form-grupo">
          <label>Unidad *</label>
          <select formControlName="unidad">
            <option value="kg">Kilogramos (kg)</option>
            <option value="litros">Litros</option>
            <option value="unidades">Unidades</option>
            <option value="cajas">Cajas</option>
            <option value="sacos">Sacos</option>
          </select>
        </div>
      </div>

      <div class="form-fila">
        <div class="form-grupo">
          <label>Stock disponible *</label>
          <input type="number" formControlName="stockDisponible"
                 placeholder="0.00" min="0" step="0.01">
          <span class="error-msg"
                *ngIf="form.get('stockDisponible')?.invalid && form.get('stockDisponible')?.touched">
            Ingresa un stock válido (mínimo 0)
          </span>
        </div>

        <div class="form-grupo">
          <label>Stock mínimo (alerta)</label>
          <input type="number" formControlName="stockMinimo"
                 placeholder="0.00" min="0" step="0.01">
          <span class="error-msg"
                *ngIf="form.get('stockMinimo')?.invalid && form.get('stockMinimo')?.touched">
            El stock mínimo no puede ser negativo
          </span>
        </div>
      </div>

      <div class="form-grupo">
        <label>Descripción</label>
        <textarea formControlName="descripcion"
                  placeholder="Notas adicionales sobre este tipo de alimento..."></textarea>
      </div>

      <div class="formulario-acciones">
        <button type="button" class="btn btn--secundario" routerLink="/inventario">
          <span class="material-icons">close</span>
          Cancelar
        </button>
        <button type="submit" class="btn btn--primario"
                [disabled]="form.invalid || guardando">
          <span class="material-icons">save</span>
          {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar' : 'Registrar') }}
        </button>
      </div>

    </form>
  </div>
</div>
